<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TX Admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
<style>
  body{background:#0a0e17;color:#e2e8f0;font-family:system-ui,sans-serif}
  input,select,textarea{background:#0f172a!important;border:1px solid #1e293b!important;color:#e2e8f0!important;border-radius:.75rem;width:100%;padding:.65rem .9rem;font-size:.875rem}
  input:focus,select:focus,textarea:focus{outline:none;border-color:#06b6d4!important}
  .card{background:#111827;border:1px solid rgba(255,255,255,.06);border-radius:1rem}
  .btn{background:linear-gradient(135deg,#06b6d4,#a855f7);color:#fff;font-weight:600;padding:.65rem 1.2rem;border-radius:999px;font-size:.75rem;letter-spacing:.05em;text-transform:uppercase}
  .btn-sm{padding:.4rem .8rem;font-size:.65rem}
  .btn-danger{background:#7f1d1d;color:#fca5a5}
  .tab{padding:.5rem 1rem;border-radius:.75rem;font-size:.75rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:#94a3b8;cursor:pointer}
  .tab.active{background:rgba(6,182,212,.15);color:#22d3ee}
</style>
</head>
<body class="min-h-screen p-4 sm:p-6">
<div id="login" class="min-h-[80vh] flex items-center justify-center">
  <div class="card p-6 w-full max-w-sm">
    <h1 class="text-lg font-bold mb-1">TRAVIS X Admin</h1>
    <p class="text-xs text-slate-500 mb-4">Accès réservé — ne partage pas ce lien</p>
    <input type="password" id="pwd" placeholder="Mot de passe" class="mb-3" onkeydown="if(event.key==='Enter')login()"/>
    <p id="err" class="text-red-400 text-xs mb-2 hidden">Mot de passe incorrect</p>
    <button onclick="login()" class="btn w-full">Entrer</button>
  </div>
</div>

<div id="app" class="hidden max-w-4xl mx-auto">
  <div class="flex flex-wrap items-center justify-between gap-3 mb-6">
    <div>
      <h1 class="text-lg font-bold">Administration du site</h1>
      <p class="text-xs text-slate-500" id="sync">Connexion…</p>
    </div>
    <div class="flex gap-2">
      <a href="website.html" target="_blank" class="text-xs text-cyan-400 underline self-center">Voir le site</a>
      <button onclick="logout()" class="text-xs px-3 py-2 rounded-lg border border-white/10 text-slate-400">Quitter</button>
    </div>
  </div>

  <div class="flex flex-wrap gap-2 mb-6">
    <button class="tab active" data-tab="videos" onclick="showTab('videos')">Vidéos</button>
    <button class="tab" data-tab="portfolio" onclick="showTab('portfolio')">Portfolio</button>
    <button class="tab" data-tab="team" onclick="showTab('team')">Équipe</button>
  </div>

  <!-- VIDEOS -->
  <section id="tab-videos" class="tab-panel space-y-4">
    <div class="card p-5">
      <h2 class="font-semibold mb-3 text-sm">Vidéo Accueil (Hero)</h2>
      <p class="text-xs text-slate-500 mb-3">Colle un lien YouTube, Vimeo ou un lien direct .mp4</p>
      <label class="text-[10px] text-slate-500 uppercase tracking-wide">URL vidéo</label>
      <input id="hero-video" class="mt-1 mb-3" placeholder="https://www.youtube.com/watch?v=... ou https://....mp4"/>
      <label class="text-[10px] text-slate-500 uppercase tracking-wide">Titre affiché</label>
      <input id="hero-title" class="mt-1 mb-3" placeholder="Clip Vedette"/>
      <label class="text-[10px] text-slate-500 uppercase tracking-wide">Sous-titre</label>
      <input id="hero-sub" class="mt-1 mb-4" placeholder="Dernière réalisation phare"/>
      <button onclick="saveVideos()" class="btn">Enregistrer les vidéos</button>
    </div>
    <div class="card p-5">
      <h2 class="font-semibold mb-3 text-sm">Vidéo À propos (coulisses)</h2>
      <label class="text-[10px] text-slate-500 uppercase tracking-wide">URL vidéo</label>
      <input id="about-video" class="mt-1 mb-3" placeholder="https://..."/>
      <label class="text-[10px] text-slate-500 uppercase tracking-wide">Légende</label>
      <input id="about-caption" class="mt-1 mb-4" placeholder="Coulisses · Tournage & création"/>
      <button onclick="saveVideos()" class="btn">Enregistrer les vidéos</button>
    </div>
  </section>

  <!-- PORTFOLIO -->
  <section id="tab-portfolio" class="tab-panel hidden space-y-4">
    <div class="card p-5">
      <h2 class="font-semibold mb-3 text-sm">Ajouter un projet</h2>
      <div class="grid sm:grid-cols-2 gap-3 mb-3">
        <div><label class="text-[10px] text-slate-500 uppercase">Titre *</label><input id="p-title" class="mt-1" placeholder="Clip Officiel — Artiste X"/></div>
        <div><label class="text-[10px] text-slate-500 uppercase">Catégorie *</label>
          <select id="p-cat" class="mt-1">
            <option value="video">Clips & Vidéo</option>
            <option value="design">Design Graphique</option>
            <option value="web">Web & Digital</option>
            <option value="photo">Photos</option>
          </select>
        </div>
      </div>
      <div class="grid sm:grid-cols-2 gap-3 mb-3">
        <div><label class="text-[10px] text-slate-500 uppercase">Badge</label><input id="p-badge" class="mt-1" placeholder="🎬 Clips"/></div>
        <div><label class="text-[10px] text-slate-500 uppercase">Sous-titre</label><input id="p-sub" class="mt-1" placeholder="Réalisation · Montage"/></div>
      </div>
      <div class="mb-3"><label class="text-[10px] text-slate-500 uppercase">URL image / miniature</label><input id="p-image" class="mt-1" placeholder="https://..."/></div>
      <div class="mb-4"><label class="text-[10px] text-slate-500 uppercase">URL vidéo (optionnel)</label><input id="p-video" class="mt-1" placeholder="https://youtube.com/..."/></div>
      <button onclick="addPortfolio()" class="btn">Ajouter au portfolio</button>
    </div>
    <div id="portfolio-list" class="space-y-2"></div>
  </section>

  <!-- TEAM -->
  <section id="tab-team" class="tab-panel hidden space-y-4">
    <div class="card p-5">
      <h2 class="font-semibold mb-3 text-sm">Ajouter un membre</h2>
      <div class="grid sm:grid-cols-2 gap-3 mb-3">
        <div><label class="text-[10px] text-slate-500 uppercase">Nom *</label><input id="t-name" class="mt-1" placeholder="Johan M."/></div>
        <div><label class="text-[10px] text-slate-500 uppercase">Rôle *</label><input id="t-role" class="mt-1" placeholder="Fondateur & Direction"/></div>
      </div>
      <div class="mb-3"><label class="text-[10px] text-slate-500 uppercase">Description</label><textarea id="t-desc" rows="2" class="mt-1" placeholder="Courte bio..."></textarea></div>
      <div class="mb-3"><label class="text-[10px] text-slate-500 uppercase">URL photo</label><input id="t-photo" class="mt-1" placeholder="https://..."/></div>
      <div class="grid sm:grid-cols-2 gap-3 mb-4">
        <div><label class="text-[10px] text-slate-500 uppercase">Instagram</label><input id="t-ig" class="mt-1" placeholder="https://instagram.com/..."/></div>
        <div><label class="text-[10px] text-slate-500 uppercase">Email / autre lien</label><input id="t-link" class="mt-1" placeholder="mailto:... ou https://..."/></div>
      </div>
      <button onclick="addTeam()" class="btn">Ajouter le membre</button>
    </div>
    <div id="team-list" class="space-y-2"></div>
  </section>
</div>

<div id="toast" class="fixed bottom-4 left-4 right-4 sm:left-auto sm:right-4 sm:w-auto hidden">
  <div class="bg-slate-900 border border-white/10 text-white px-4 py-3 rounded-xl text-sm text-center" id="toast-msg"></div>
</div>

<script>
const PWD = 'travisx2026';
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDGb8mushDBsOnEQzk8co0Aw76FAs5vfvE",
  authDomain: "travis-x-studio.firebaseapp.com",
  projectId: "travis-x-studio",
  storageBucket: "travis-x-studio.firebasestorage.app",
  messagingSenderId: "512460521350",
  appId: "1:512460521350:web:c4a81bbddd7b84a538b607"
};
const DOC = 'website';
let db = null, D = { heroVideo:'', heroTitle:'Clip Vedette', heroSub:'Dernière réalisation phare', aboutVideo:'', aboutCaption:'Coulisses · Tournage & création', portfolio:[], team:[] };

function login() {
  if (document.getElementById('pwd').value === PWD) {
    sessionStorage.setItem('tx_site_admin','1');
    document.getElementById('login').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    init();
  } else {
    document.getElementById('err').classList.remove('hidden');
  }
}
function logout() {
  sessionStorage.removeItem('tx_site_admin');
  location.reload();
}

function showTab(name) {
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.add('hidden'));
  document.getElementById('tab-'+name).classList.remove('hidden');
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
}

function toast(m) {
  const t = document.getElementById('toast');
  document.getElementById('toast-msg').textContent = m;
  t.classList.remove('hidden');
  setTimeout(() => t.classList.add('hidden'), 2200);
}

function init() {
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.firestore();
    document.getElementById('sync').textContent = 'Synchronisation…';
    db.collection('travisx').doc(DOC).onSnapshot(snap => {
      if (snap.exists) {
        const d = snap.data();
        D = {
          heroVideo: d.heroVideo || '',
          heroTitle: d.heroTitle || 'Clip Vedette',
          heroSub: d.heroSub || 'Dernière réalisation phare',
          aboutVideo: d.aboutVideo || '',
          aboutCaption: d.aboutCaption || 'Coulisses · Tournage & création',
          portfolio: d.portfolio || [],
          team: d.team || []
        };
      }
      fillForms();
      renderPortfolio();
      renderTeam();
      document.getElementById('sync').textContent = 'En ligne · synchronisé';
      document.getElementById('sync').className = 'text-xs text-emerald-400';
    }, err => {
      console.error(err);
      document.getElementById('sync').textContent = 'Erreur Firebase — vérifie les règles';
      document.getElementById('sync').className = 'text-xs text-red-400';
    });
  } catch (e) {
    console.error(e);
    document.getElementById('sync').textContent = 'Erreur init Firebase';
  }
}

function fillForms() {
  document.getElementById('hero-video').value = D.heroVideo;
  document.getElementById('hero-title').value = D.heroTitle;
  document.getElementById('hero-sub').value = D.heroSub;
  document.getElementById('about-video').value = D.aboutVideo;
  document.getElementById('about-caption').value = D.aboutCaption;
}

function saveAll() {
  if (!db) return toast('Pas de connexion Firebase');
  document.getElementById('sync').textContent = 'Enregistrement…';
  return db.collection('travisx').doc(DOC).set({
    heroVideo: D.heroVideo,
    heroTitle: D.heroTitle,
    heroSub: D.heroSub,
    aboutVideo: D.aboutVideo,
    aboutCaption: D.aboutCaption,
    portfolio: D.portfolio,
    team: D.team,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
  }, { merge: true }).then(() => {
    document.getElementById('sync').textContent = 'En ligne · synchronisé';
    toast('Enregistré');
  }).catch(e => {
    console.error(e);
    toast('Erreur sauvegarde');
  });
}

function saveVideos() {
  D.heroVideo = document.getElementById('hero-video').value.trim();
  D.heroTitle = document.getElementById('hero-title').value.trim() || 'Clip Vedette';
  D.heroSub = document.getElementById('hero-sub').value.trim() || 'Dernière réalisation phare';
  D.aboutVideo = document.getElementById('about-video').value.trim();
  D.aboutCaption = document.getElementById('about-caption').value.trim() || 'Coulisses · Tournage & création';
  saveAll();
}

function gid(arr) { return arr.length ? Math.max(...arr.map(x => x.id || 0)) + 1 : 1; }

function addPortfolio() {
  const title = document.getElementById('p-title').value.trim();
  if (!title) return toast('Titre obligatoire');
  D.portfolio.unshift({
    id: gid(D.portfolio),
    title,
    cat: document.getElementById('p-cat').value,
    badge: document.getElementById('p-badge').value.trim() || '🎬',
    sub: document.getElementById('p-sub').value.trim(),
    image: document.getElementById('p-image').value.trim(),
    video: document.getElementById('p-video').value.trim()
  });
  ['p-title','p-badge','p-sub','p-image','p-video'].forEach(id => document.getElementById(id).value = '');
  renderPortfolio();
  saveAll();
}

function delPortfolio(id) {
  if (!confirm('Supprimer ce projet ?')) return;
  D.portfolio = D.portfolio.filter(p => p.id !== id);
  renderPortfolio();
  saveAll();
}

function renderPortfolio() {
  const el = document.getElementById('portfolio-list');
  if (!D.portfolio.length) {
    el.innerHTML = '<p class="text-xs text-slate-500 text-center py-6">Aucun projet — ajoute le premier</p>';
    return;
  }
  const cats = { video:'Vidéo', design:'Design', web:'Web', photo:'Photo' };
  el.innerHTML = D.portfolio.map(p => `
    <div class="card p-4 flex items-start gap-3">
      <div class="w-14 h-14 rounded-lg bg-slate-800 overflow-hidden shrink-0 border border-white/5">
        ${p.image ? `<img src="${esc(p.image)}" class="w-full h-full object-cover" onerror="this.style.display='none'"/>` : '<div class="w-full h-full flex items-center justify-center text-slate-600 text-xs">IMG</div>'}
      </div>
      <div class="flex-1 min-w-0">
        <p class="font-medium text-sm truncate">${esc(p.title)}</p>
        <p class="text-[11px] text-slate-500">${cats[p.cat]||p.cat} · ${esc(p.sub||'')}</p>
      </div>
      <button onclick="delPortfolio(${p.id})" class="btn-sm btn-danger rounded-lg px-2 py-1 text-xs">Suppr</button>
    </div>
  `).join('');
}

function addTeam() {
  const name = document.getElementById('t-name').value.trim();
  const role = document.getElementById('t-role').value.trim();
  if (!name || !role) return toast('Nom et rôle obligatoires');
  D.team.push({
    id: gid(D.team),
    name, role,
    desc: document.getElementById('t-desc').value.trim(),
    photo: document.getElementById('t-photo').value.trim(),
    ig: document.getElementById('t-ig').value.trim(),
    link: document.getElementById('t-link').value.trim()
  });
  ['t-name','t-role','t-desc','t-photo','t-ig','t-link'].forEach(id => document.getElementById(id).value = '');
  renderTeam();
  saveAll();
}

function delTeam(id) {
  if (!confirm('Supprimer ce membre ?')) return;
  D.team = D.team.filter(t => t.id !== id);
  renderTeam();
  saveAll();
}

function renderTeam() {
  const el = document.getElementById('team-list');
  if (!D.team.length) {
    el.innerHTML = '<p class="text-xs text-slate-500 text-center py-6">Aucun membre — ajoute le premier</p>';
    return;
  }
  el.innerHTML = D.team.map(t => `
    <div class="card p-4 flex items-start gap-3">
      <div class="w-12 h-12 rounded-full bg-slate-800 overflow-hidden shrink-0 border border-white/5">
        ${t.photo ? `<img src="${esc(t.photo)}" class="w-full h-full object-cover"/>` : `<div class="w-full h-full flex items-center justify-center text-xs font-bold text-cyan-400">${ini(t.name)}</div>`}
      </div>
      <div class="flex-1 min-w-0">
        <p class="font-medium text-sm">${esc(t.name)}</p>
        <p class="text-[11px] text-cyan-400">${esc(t.role)}</p>
        <p class="text-[11px] text-slate-500 mt-0.5 line-clamp-2">${esc(t.desc||'')}</p>
      </div>
      <button onclick="delTeam(${t.id})" class="btn-sm btn-danger rounded-lg px-2 py-1 text-xs">Suppr</button>
    </div>
  `).join('');
}

function esc(s){ if(!s)return''; const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function ini(n){ return (n||'?').split(' ').map(x=>x[0]).slice(0,2).join('').toUpperCase(); }

if (sessionStorage.getItem('tx_site_admin') === '1') {
  document.getElementById('login').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  init();
}
</script>
</body>
</html>
